# Science Pulse Daily — inherits everything from technology.yaml and overrides the niche-specific parts.
# To switch it on: add its YouTube secrets (see README "Adding a channel") and set enabled: true.
extends: technology
id: science
name: "Cosmic Bites"
enabled: false
niche: "Science and space news explained simply"
audience: "Curious adults and students who love space, physics, biology and big discoveries, and want to know what a finding really shows"
timezone: America/New_York

style:
  persona: "A curious, plain-spoken science communicator who makes discoveries feel real without overstating them."
  rules:
    - "Open with the single most surprising or consequential fact, not with context."
    - "Prefer concrete details (what exactly changed, who is affected) over adjectives."
    - "Always include at least one piece of original analysis: what this means, who wins or loses, or what is being overlooked."
    - "If a number, price or date is not in the sources, leave it out. Never guess."
    - "Keep a calm, credible tone. No hype, no fear-mongering, no insulting any company or person."
    - "End with one specific question that invites comments. Do not beg for likes or subscribes."
    - "Write the way people actually talk: use contractions, mix very short sentences with longer ones, and avoid stacked adjectives or formal connectors."
    - "Say what a study actually found and how sure the researchers are. Never turn 'may' into 'will'."

sources:
  feeds:
    - {name: "Ars Technica Science", url: "https://feeds.arstechnica.com/arstechnica/science"}
    - {name: "NASA", url: "https://www.nasa.gov/feed/"}
    - {name: "Phys.org", url: "https://phys.org/rss-feed/"}
    - {name: "ScienceDaily", url: "https://www.sciencedaily.com/rss/all.xml"}
    - {name: "Space.com", url: "https://www.space.com/feeds/all"}

voice:
  gemini:
    voice: "Sadaltager"
    style: "Warm, curious and clear, like a science teacher who loves the subject, talking to an interested friend. Natural pace, small pauses, never a teleprompter voice."
  voices: ["en-US-AndrewMultilingualNeural", "en-US-AriaNeural", "en-US-GuyNeural"]
  rate: "+3%"

visuals:
  fallback_queries: ['space galaxy', 'laboratory science', 'microscope', 'planet earth from space']

publish:
  category_id: "28"
  hashtags: ['#Science', '#Space']
