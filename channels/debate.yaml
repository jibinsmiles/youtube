# Bahas Tadka (@BahasTadkaIN) — the safe version of "controversial videos only": both sides of debates that split
# opinion, then what the evidence says. Balanced, neutral, advertiser-friendly. Inherits technology.yaml.
# Switched on once YOUTUBE_REFRESH_TOKEN_DEBATE exists (see README "Channels 2-5").
extends: technology
id: debate
name: "Bahas Tadka"
enabled: false
niche: "Debates that split opinion, explained fairly: the strongest case for, the strongest case against, then what the evidence says"
audience: "Curious Indians aged 18-35 who enjoy a good argument, hate one-sided takes, and want to know who actually has the facts on their side"

style:
  persona: "A sharp, fair debate moderator with a sense of humour: steelmans both sides, never mocks anyone, and only declares a winner when the evidence clearly does."
  rules:
    - "Open with the debate as a sharp, fair question or the most surprising fact on either side, not with context."
    - "Give both sides their STRONGEST version with roughly equal time, each point backed by the sources."
    - "Then say what the evidence shows. Declare a verdict only when the sources clearly support one; if it is a values question, say so and explain what each choice trades off."
    - "Never create false balance on settled science (vaccines work, climate change is real and human-caused, evolution, the shape of the Earth). If one side has no evidence, say so plainly."
    - "Never insult, stereotype or mock any group, person, region, religion, caste, gender or profession."
    - "Clearly separate fact from opinion ('supporters argue...', 'the data shows...', 'my read is...')."
    - "Write the way people actually talk: contractions, punchy short sentences mixed with longer ones."
    - "End by asking which side the viewer is on and why. Do not beg for likes or subscribes."
  thumbnail_rules:
    - "frame it as a fair question or contrast ('MYTH OR SCIENCE?', 'WHO IS RIGHT?'), never as an insult or an attack"
    - "never state a verdict the video does not reach"
  banned_phrases: ["game-changer", "revolutionize", "you won't believe", "mind-blowing", "stay tuned", "welcome back",
                   "furthermore", "moreover", "delve", "in conclusion", "it is worth noting", "don't forget to subscribe",
                   "smash that", "buckle up", "idiots", "libtard", "bhakt", "sanghi", "sickular"]

compliance:
  - "Both sides must be presented fairly with their strongest arguments; flag one-sided framing."
  - "No party politics, politicians, elections, religion, caste, communal, regional or linguistic disputes, wars or border conflicts, terrorism."
  - "No abortion, sexuality or gender-identity debates, guns, or immigration."
  - "No false balance on settled science (vaccine safety, climate change, evolution); flag any line that treats them as open questions."
  - "No insults or stereotypes about any group, person or profession."
  - "A verdict is only allowed when the sources clearly support it."

schedule:
  go_live:
    short: ["09:00", "12:00", "16:00", "18:00", "20:00", "22:30"]
    long: ["14:30", "21:30"]

content_mix:
  evergreen_share: 1.0
evergreen:
  memory_days: 365
  hint: "everyday debates that split opinion: food and health (is breakfast the most important meal, is ghee healthy, is coffee good for you), lifestyle (early birds vs night owls, work from home vs office, is 10,000 steps real), tech (is AI art real art, are electric cars really greener, should kids have smartphones), education (should homework exist, do degrees still matter), science and energy (is nuclear power safe), sport (is T20 killing Test cricket), history's great debates (was the Titanic avoidable, did Napoleon really lose because of the weather)"
  rules:
    - "Never: party politics, politicians, elections, religion, caste, communal topics, regional or language disputes, wars, borders, terrorism, abortion, sexuality or gender identity, guns, immigration, or any ongoing court case or recent tragedy."
    - "Never frame settled science as a debate (vaccine safety, climate change, evolution, the shape of the Earth); those can only appear as myths being corrected."
    - "Pick debates with genuinely good arguments on both sides and a detailed Wikipedia article covering them."
    - "The topic phrase must be the debate question, e.g. 'Is nuclear power safe?'"
  structure:
    short: "HOOK (scene 1: the debate as a sharp question or the most surprising fact, max 12 words, and promise a payoff that comes LATER, e.g. 'and the data at the end surprises both sides') -> why people disagree, in one line -> the strongest case FOR, each scene a NEW fact -> the strongest case AGAINST, same weight, each scene a NEW fact -> what the evidence actually says (the promised payoff), with a verdict only if the sources clearly support one -> 'which side are you on?' -> a last line that echoes the opening question so the video loops."
    long: "COLD OPEN (1-2 scenes: the debate as a sharp question, or the most surprising fact on either side, no greeting) -> why it matters and why people disagree -> promise what the viewer will know by the end -> the background and how the debate started -> the strongest case FOR, point by point with evidence -> a mini-cliffhanger ('but the other side has a point nobody mentions') -> the strongest case AGAINST, point by point, same weight -> what the best evidence says, and where it is genuinely a values choice -> the verdict only if the evidence is clear, otherwise what each choice trades off -> one closing question: which side are you on and why -> a final line echoing the cold open. Every section adds something new. Do NOT stop early: reach the full word count."

sources:
  feeds: []

voice:
  providers: ["kokoro", "edge"]
  providers_by_kind:
    short: ["kokoro", "edge"]
    long: ["kokoro", "edge"]
  kokoro:
    voice: "af_bella"          # lively, neutral moderator
    speed: 1.03
    lang: "en-us"
  voices: ["en-US-AvaMultilingualNeural", "en-IN-NeerjaNeural"]
  rate: "+4%"

visuals:
  fallback_queries: ["people discussing at table", "balance scale", "busy city street", "two paths crossroads", "audience listening"]

publish:
  category_id: "27"            # Education
  expected_channel: "Bahas Tadka"
  disclosure: "Both sides are presented from the sources above; a verdict is given only where the evidence is clear. Narration is AI-generated."
  hashtags: ["#Debate", "#BothSides", "#MythVsFact"]

llm:
  lite_for_visuals: true       # footage checks use the "lite" Gemini models; the scarce full models write the scripts

fact_check_notes:
  - "Numbers written out in words for the narrator ('two thousand one', 'ten crore') mean the same as digits; never flag how a number, name or title is spelled or formatted."
  - "Do not flag the narrator's framing, analogies or clearly hypothetical examples as long as they add no new factual claim."

formats:
  long:
    expand_rounds: 4           # free "lite" models write long scripts short; give them more rounds to deepen the draft
