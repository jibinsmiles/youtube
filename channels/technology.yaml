# ---------------------------------------------------------------------------
# Channel: Technology (India angle).  To add another channel, copy this file,
# change the niche/sources/style, and add its refresh-token secret.
# ---------------------------------------------------------------------------
id: technology
name: Tech Tadka
niche: "Technology news and explainers with an India angle"
audience: "Curious Indian tech enthusiasts, students and working professionals (18-40) who want to know what a tech story actually means for them"
timezone: Asia/Kolkata
enabled: true                   # set false to pause this channel (the workflow skips it)

style:
  persona: "A sharp, friendly tech analyst who explains things like a smart friend: clear, specific, a little dry humour, never hypey."
  rules:
    - "Open with the single most surprising or consequential fact, not with context."
    - "Prefer concrete details (what exactly changed, who is affected) over adjectives."
    - "Always include at least one piece of original analysis: what this means, who wins or loses, or what is being overlooked."
    - "If prices or availability are not in the sources, do not guess and do not claim they are unannounced. Leave them out, or say the report does not mention them."
    - "Add an India angle only when the sources support one; otherwise focus on the wider impact."
    - "Keep a calm, credible tone. No hype, no fear-mongering, no insulting any company or person."
    - "End with one specific question that invites comments. Do not beg for likes or subscribes."
    - "Write the way people actually talk: use contractions, mix very short sentences with longer ones, and avoid stacked adjectives or formal connectors."
  banned_phrases:
    - "game-changer"
    - "game changer"
    - "revolutionize"
    - "in today's fast-paced"
    - "tech world is buzzing"
    - "major developments"
    - "unfolding rapidly"
    - "buckle up"
    - "you won't believe"
    - "mind-blowing"
    - "stay tuned"
    - "welcome back"
    - "furthermore"
    - "moreover"
    - "delve"
    - "in conclusion"
    - "it is worth noting"
    - "don't forget to subscribe"
    - "smash that"

schedule:
  shorts_per_day: 6
  long_per_day: 3
  max_long_per_day: 3
  min_gap_minutes: 50          # spread uploads through the day
  active_hours: [7, 23]        # local time window in which runs may publish
  short_min_score: 6           # story must score at least this (1-10) to be used
  long_min_score: 7
  extra_long_min_score: 9      # only used if max_long_per_day > long_per_day

content_mix:
  evergreen_share: 0.75        # 75% timeless explainers (search / suggested traffic), 25% news-driven videos
evergreen:
  hint: "how everyday tech works (UPI, 5G, Wi-Fi, GPS, cloud, AI and chatbots, chips, batteries, encryption, the internet), smartphone and gadget concepts, cybersecurity basics, famous tech history, how startups and big tech companies work"

formats:
  short:
    width: 1080
    height: 1920
    target: "95-125"
    scene_words: "9-14"
    min_words: 60               # ~25 s; the model tends to land a little under the target
    max_words: 145
    captions: true
  long:
    width: 1920
    height: 1080
    target: "1100-1400"
    scene_words: "22-38"
    min_words: 850
    max_words: 1700
    captions: false            # YouTube auto-captions cover long videos

research:
  min_chars_short: 500         # not enough source text? skip rather than invent
  min_chars_long: 3500

sources:
  feeds:
    - {name: "The Verge",        url: "https://www.theverge.com/rss/index.xml"}
    - {name: "TechCrunch",       url: "https://techcrunch.com/feed/"}
    - {name: "Ars Technica",     url: "https://feeds.arstechnica.com/arstechnica/index"}
    - {name: "Engadget",         url: "https://www.engadget.com/rss.xml"}
    - {name: "Wired",            url: "https://www.wired.com/feed/rss"}
    - {name: "Hacker News",      url: "https://hnrss.org/frontpage?points=150"}
    - {name: "Inc42",            url: "https://inc42.com/feed/"}
    - {name: "Medianama",        url: "https://www.medianama.com/feed/"}
    - {name: "The Hindu",        url: "https://www.thehindu.com/sci-tech/technology/feeder/default.rss"}

voice:
  # Tried in this order for the whole video; a failure (quota, outage) falls through to the next provider.
  # elevenlabs only counts if ELEVENLABS_API_KEY and elevenlabs.voice_id are set. edge is the free last resort.
  providers: ["elevenlabs", "gemini", "edge"]
  gemini:
    models: ["gemini-3.8-flash-tts", "gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
    voice: "Charon"            # Informative. Other good picks: Sadaltager (knowledgeable), Achird (friendly), Sulafat (warm), Iapetus (clear)
    style: "Warm, confident and conversational, like a friendly tech journalist explaining the news to a smart friend. Natural pace with small pauses, light emphasis on the key facts, never like a news announcer reading a teleprompter."
  voices: ["en-IN-NeerjaExpressiveNeural", "en-IN-NeerjaNeural", "en-US-AriaNeural"]   # edge-tts fallback
  rate: "+4%"

elevenlabs:                    # only used if provider: elevenlabs (+ ELEVENLABS_API_KEY secret)
  voice_id: ""
  model_id: "eleven_multilingual_v2"

visuals:
  providers: ["pixabay", "pexels"]   # tried in this order; skipped if that API key secret is not set
  fallback_queries: ["technology", "futuristic abstract", "person using smartphone", "city night lights"]

publish:
  mode: auto                   # auto = public immediately | veto = private, auto-publishes after veto_hours | review = private, you publish by hand
  veto_hours: 3
  category_id: "28"            # Science & Technology
  default_language: en
  disclosure: "Script researched from the sources above. Narration is AI-generated."
  hashtags: ["#TechNews", "#India"]
