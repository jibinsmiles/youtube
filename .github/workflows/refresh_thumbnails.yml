name: Refresh thumbnails

# One-off: give already-published long videos the new thumbnail style. Safe to re-run (it skips finished videos).
on:
  workflow_dispatch:
    inputs:
      channel:
        default: "technology"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: video-robot-${{ github.event.inputs.channel || 'technology' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python packages
        run: pip install -r requirements.txt yt-dlp
      - name: Refresh thumbnails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # YouTube credentials: shared ones, plus optional per-channel overrides (add a line per new channel).
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_ID_TECHNOLOGY }}
          YOUTUBE_CLIENT_SECRET_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_SECRET_TECHNOLOGY }}
          YOUTUBE_REFRESH_TOKEN_TECHNOLOGY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TECHNOLOGY }}
          YOUTUBE_CLIENT_ID_SCIENCE: ${{ secrets.YOUTUBE_CLIENT_ID_SCIENCE }}
          YOUTUBE_CLIENT_SECRET_SCIENCE: ${{ secrets.YOUTUBE_CLIENT_SECRET_SCIENCE }}
          YOUTUBE_REFRESH_TOKEN_SCIENCE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_SCIENCE }}
          YOUTUBE_CLIENT_ID_AUTOMOTIVE: ${{ secrets.YOUTUBE_CLIENT_ID_AUTOMOTIVE }}
          YOUTUBE_CLIENT_SECRET_AUTOMOTIVE: ${{ secrets.YOUTUBE_CLIENT_SECRET_AUTOMOTIVE }}
          YOUTUBE_REFRESH_TOKEN_AUTOMOTIVE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_AUTOMOTIVE }}
          YOUTUBE_CLIENT_ID_GAMING: ${{ secrets.YOUTUBE_CLIENT_ID_GAMING }}
          YOUTUBE_CLIENT_SECRET_GAMING: ${{ secrets.YOUTUBE_CLIENT_SECRET_GAMING }}
          YOUTUBE_REFRESH_TOKEN_GAMING: ${{ secrets.YOUTUBE_REFRESH_TOKEN_GAMING }}
        run: python scripts/refresh_thumbnails.py "${{ github.event.inputs.channel || 'technology' }}"
      - name: Save state
        if: always()
        run: |
          git config user.name  "video-robot"
          git config user.email "video-robot@users.noreply.github.com"
          git add data/state_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: thumbnails refreshed [skip ci]"
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((RANDOM % 8 + 3))
            done
          fi
