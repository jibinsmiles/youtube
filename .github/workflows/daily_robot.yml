name: Daily video robot

on:
  schedule:
    # 07:00, 10:00, 13:00, 16:00, 19:00, 22:00 India time (UTC+5:30).
    # Each run makes at most ONE video, and only if a strong story is available
    # and today's targets/min-gap allow it (see channels/technology.yaml).
    - cron: "30 1,4,7,10,13,16 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "auto | short | long"
        default: "auto"

permissions:
  contents: write            # lets the job commit data/state.json back to the repo

concurrency:
  group: video-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          INPUT_KIND: ${{ github.event.inputs.kind }}
        run: |
          KIND="${INPUT_KIND:-auto}"
          python -m pipeline.main --channel technology --kind "$KIND"

      - name: Save state (what we already covered)
        if: always()
        run: |
          git config user.name  "video-robot"
          git config user.email "video-robot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || true
          fi
