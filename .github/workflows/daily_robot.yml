name: Daily video robot

on:
  schedule:
    # Every hour. Each enabled channel makes at most ONE video per run, and only if a strong story is
    # available and its own active hours / daily targets / minimum gap allow it (see channels/<id>.yaml).
    - cron: "17 * * * *"      # off-peak minute: GitHub delays or skips runs at :00 and :30 when it is busy
    - cron: "47 * * * *"      # backup slot: if GitHub drops one tick the other still fires (the per-channel minimum gap prevents double posting)
  workflow_dispatch:
    inputs:
      channel:
        description: "all (every enabled channel) or one channel id, e.g. technology"
        default: "all"
      mode:
        description: "auto (follows content_mix) | evergreen | news"
        default: "auto"
      kind:
        description: "auto | short | long"
        default: "auto"
      visibility:
        description: "public = normal run | private = upload as a private TEST video (not recorded, topic stays available)"
        type: choice
        options: [public, private]
        default: public

permissions:
  contents: write            # lets each job commit its data/state_<channel>.json back to the repo

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.list.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: list
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: echo "channels=$(python scripts/list_channels.py "${INPUT_CHANNEL:-all}")" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false                 # one channel failing never stops the others
      max-parallel: 20
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
    concurrency:
      group: video-robot-${{ matrix.channel }}      # never two runs for the same channel at once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache the free Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Run pipeline (${{ matrix.channel }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # YouTube credentials: shared ones, plus optional per-channel overrides (add a line per new channel).
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_ID_TECHNOLOGY }}
          YOUTUBE_CLIENT_SECRET_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_SECRET_TECHNOLOGY }}
          YOUTUBE_REFRESH_TOKEN_TECHNOLOGY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TECHNOLOGY }}
          YOUTUBE_CLIENT_ID_SCIENCE: ${{ secrets.YOUTUBE_CLIENT_ID_SCIENCE }}
          YOUTUBE_CLIENT_SECRET_SCIENCE: ${{ secrets.YOUTUBE_CLIENT_SECRET_SCIENCE }}
          YOUTUBE_REFRESH_TOKEN_SCIENCE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_SCIENCE }}
          YOUTUBE_CLIENT_ID_AUTOMOTIVE: ${{ secrets.YOUTUBE_CLIENT_ID_AUTOMOTIVE }}
          YOUTUBE_CLIENT_SECRET_AUTOMOTIVE: ${{ secrets.YOUTUBE_CLIENT_SECRET_AUTOMOTIVE }}
          YOUTUBE_REFRESH_TOKEN_AUTOMOTIVE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_AUTOMOTIVE }}
          YOUTUBE_CLIENT_ID_GAMING: ${{ secrets.YOUTUBE_CLIENT_ID_GAMING }}
          YOUTUBE_CLIENT_SECRET_GAMING: ${{ secrets.YOUTUBE_CLIENT_SECRET_GAMING }}
          YOUTUBE_REFRESH_TOKEN_GAMING: ${{ secrets.YOUTUBE_REFRESH_TOKEN_GAMING }}
          CHANNEL: ${{ matrix.channel }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          INPUT_KIND: ${{ github.event.inputs.kind }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_VISIBILITY: ${{ github.event.inputs.visibility }}
        run: |
          KIND="${INPUT_KIND:-auto}"
          python -m pipeline.main --channel "$CHANNEL" --kind "$KIND" --mode "${INPUT_MODE:-auto}" --visibility "${INPUT_VISIBILITY:-public}"

      - name: Save state (what this channel already covered)
        if: always()
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          git config user.name  "video-robot"
          git config user.email "video-robot@users.noreply.github.com"
          git add "data/state_${CHANNEL}.json" || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ${CHANNEL} state [skip ci]"
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((RANDOM % 8 + 3))
            done
          fi
