name: Private test run

# Makes PRIVATE test videos (not recorded, topic stays available) for review before a channel goes live.
# Start it with "Run workflow", or by pushing a change to .github/test-run.txt (one "channel kind mode upload" per line;
# upload = upload a private video, dry = render only and keep the file as a downloadable run artifact).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Space-separated channel:kind:mode items, e.g. crime:short:auto health:long:evergreen"
        default: "crime:short:auto"
  push:
    branches: [main]
    paths: [".github/test-run.txt"]

permissions:
  contents: write          # dry runs push review material (script, frames, thumbnail) to the "review" branch

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.list.outputs.items }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          RUNS: ${{ github.event.inputs.runs }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ.get("RUNS") or ""
          if raw.strip():
              lines = [x.replace(":", " ") for x in raw.split()]
          else:
              lines = [l for l in open(".github/test-run.txt") if l.strip() and not l.startswith("#")]
          items = []
          for l in lines:
              p = l.split()
              p += ["short", "auto", "upload"][len(p) - 1:]
              items.append({"channel": p[0], "kind": p[1], "mode": p[2], "upload": p[3]})
          print("items=" + json.dumps(items))
          EOF

  run:
    needs: prepare
    if: needs.prepare.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.items) }}
    concurrency:
      group: video-robot-${{ matrix.item.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Cache the free Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Private test (${{ matrix.item.channel }} ${{ matrix.item.kind }} ${{ matrix.item.mode }})
        env:
          CHANNEL: ${{ matrix.item.channel }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_ID_TECHNOLOGY }}
          YOUTUBE_CLIENT_SECRET_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_SECRET_TECHNOLOGY }}
          YOUTUBE_REFRESH_TOKEN_CRIME: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CRIME }}
          GEMINI_API_KEY_CRIME: ${{ secrets.GEMINI_API_KEY_CRIME }}
          YOUTUBE_REFRESH_TOKEN_HEALTH: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HEALTH }}
          GEMINI_API_KEY_HEALTH: ${{ secrets.GEMINI_API_KEY_HEALTH }}
          YOUTUBE_REFRESH_TOKEN_FINANCE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FINANCE }}
          GEMINI_API_KEY_FINANCE: ${{ secrets.GEMINI_API_KEY_FINANCE }}
          YOUTUBE_REFRESH_TOKEN_DEBATE: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DEBATE }}
          GEMINI_API_KEY_DEBATE: ${{ secrets.GEMINI_API_KEY_DEBATE }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          case "$CHANNEL" in technology) echo "Refusing to test-run Tech Tadka from here"; exit 1;; esac
          KEYVAR="GEMINI_API_KEY_${CHANNEL^^}"
          if [ -z "${!KEYVAR}" ]; then echo "::error::$KEYVAR is not set yet - not using Tech Tadka's shared key"; exit 1; fi
          EXTRA="--visibility private"
          [ "${{ matrix.item.upload }}" = "dry" ] && EXTRA="--dry-run"
          python -m pipeline.main --channel "$CHANNEL" --kind "${{ matrix.item.kind }}" --mode "${{ matrix.item.mode }}" $EXTRA
      - name: Push review material to the "review" branch (dry runs)
        if: always() && matrix.item.upload == 'dry'
        env:
          TAG: ${{ matrix.item.channel }}-${{ matrix.item.kind }}
        run: |
          set -e
          ls out/*.mp4 >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/rev/$TAG
          for v in out/*.mp4; do
            b=$(basename "$v" .mp4)
            ffmpeg -loglevel error -y -i "$v" -vf "fps=1/2.5,scale=-2:300,tile=8x4" -frames:v 1 /tmp/rev/$TAG/${b}_sheet.jpg || true
            ffmpeg -loglevel error -y -ss 1 -i "$v" -frames:v 1 -vf "scale=-2:720" /tmp/rev/$TAG/${b}_frame1s.jpg || true
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$v" > /tmp/rev/$TAG/${b}_duration.txt
          done
          cp out/*.json out/*.jpg /tmp/rev/$TAG/ 2>/dev/null || true
          git config user.name "video-robot"; git config user.email "video-robot@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            rm -rf /tmp/rb && git clone -q --depth 1 --branch review "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/rb 2>/dev/null \
              || { git init -q /tmp/rb && git -C /tmp/rb checkout -q -b review && git -C /tmp/rb remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
            mkdir -p /tmp/rb/review && rm -rf /tmp/rb/review/$TAG && cp -r /tmp/rev/$TAG /tmp/rb/review/
            git -C /tmp/rb add -A && git -C /tmp/rb -c user.name=video-robot -c user.email=video-robot@users.noreply.github.com commit -q -m "review: $TAG [skip ci]" || true
            git -C /tmp/rb push -q origin review && break
            sleep $((RANDOM % 10 + 3))
          done
      - name: Keep the rendered video (dry runs)
        if: always() && matrix.item.upload == 'dry'
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.item.channel }}-${{ matrix.item.kind }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore
